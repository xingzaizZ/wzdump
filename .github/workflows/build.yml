# ============================================================
# build.yml —�?GitHub Actions 编译 wzdump.dylib
# ============================================================
# 触发：push �?main / 手动 workflow_dispatch
#
# 产物�?#   build/wzdump.dylib          fat（arm64 + arm64e�?#   build/wzdump-arm64.dylib    单架构（A11 及更早）
#   build/wzdump-arm64e.dylib   单架构（A12 及更新）
# ============================================================
name: build-dylib

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.m'
      - '**.h'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - arm64
          - arm64e

permissions:
  contents: write

jobs:
  build:
    name: 编译 wzdump.dylib
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 环境自检
        run: |
          echo "===== Xcode ====="
          xcodebuild -version
          echo "===== iPhoneOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          echo "===== clang ====="
          clang --version

      - name: 结构自查
        run: |
          node tools/check_syntax.js wz_unlock.m il2cpp_api.m il2cpp_api.h \
                                     hook_arm64.m hook_arm64.h wz_map.h \
                                     pac_fix.h il2cpp_call.h \
                                     thread_freeze.h thread_freeze.m \
                                     wzlog.h wzlog.m il2cpp_dump.h il2cpp_dump.m
          echo ""
          echo "===== 防闪退检查（R1~R6�?===="
          node tools/check_abi.js wz_unlock.m il2cpp_api.m \
                                  hook_arm64.m thread_freeze.m wzlog.m

      - name: 编译
        run: |
          chmod +x build.sh
          ARCH="${{ github.event.inputs.arch }}"
          ARCH="${ARCH:-both}"
          echo "目标架构: $ARCH"
          ./build.sh "$ARCH"

      - name: 校验产物
        run: |
          echo "===== 文件 ====="
          ls -lh build/
          echo ""
          echo "===== 架构 ====="
          lipo -info build/wzdump.dylib
          echo ""
          echo "===== 依赖 ====="
          otool -L build/wzdump.dylib
          echo ""
          echo "===== 签名 ====="
          codesign -dv build/wzdump.dylib 2>&1 | head -12 || true
          echo ""
          echo "===== 签名有效性（必须通过�?===="
          codesign -v --verbose=2 build/wzdump.dylib
          echo "codesign 校验通过"

      - name: 验证 PAC 指令（arm64e 必须有）
        run: |
          if lipo -info build/wzdump.dylib | grep -q arm64e; then
            echo "arm64e slice 存在，统计控制流指令�?
            node tools/scan_calls.js build/wzdump-arm64e.dylib
            echo ""
            N=$(node tools/scan_calls.js build/wzdump-arm64e.dylib | \
                grep -oE 'BLRAAZ/BLRABZ *: [0-9]+' | grep -oE '[0-9]+$' || echo 0)
            echo "BLRAAZ 数量: ${N:-0}"
            if [ "${N:-0}" -eq 0 ]; then
              echo "  !! 没有 BLRAAZ —�?-fptrauth-calls 可能没生�?
              echo "  这不一定是错误（如果没有函数指针调用就不需要），但要人工确�?
            fi
          fi

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: wzdump-dylib-${{ github.sha }}
          path: |
            build/wzdump.dylib
            build/wzdump-arm64.dylib
            build/wzdump-arm64e.dylib
          if-no-files-found: error
          retention-days: 30
